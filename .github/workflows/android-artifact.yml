name: Android APK Build

on:
  push:
    branches: [ main, feat/prod-nuclear-setup ] # ضفنا main هنا عشان يشتغل لما ترفع
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # شيلنا شرط الـ secret مؤقتاً عشان نتأكد إنه شغال، أو اتأكد إنك ضايفه في GitHub Settings
    # if: ${{ secrets.CI_ANDROID == 'true' }} 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # خطوة مهمة جداً كانت ناقصة عشان الـ If اللي تحت تشتغل
      - name: Check Workspace Structure
        id: workspace-check
        run: |
          if [ -d "app" ]; then echo "app_exists=true" >> $GITHUB_OUTPUT; fi
          if [ -d "app/android" ]; then echo "android_exists=true" >> $GITHUB_OUTPUT; fi

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json # عدلنا المسار للجذر زي ما اتفقنا ✅

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Build frontend ──────────────────────────────────────────────
      - name: Frontend — npm install
        if: steps.workspace-check.outputs.app_exists == 'true'
        run: |
          npm install # بنعمل install من الجذر لأن الـ lock file بره
          cd app && npm install --legacy-peer-deps

      - name: Frontend — build
        if: steps.workspace-check.outputs.app_exists == 'true'
        run: cd app && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ── Capacitor sync ──────────────────────────────────────────────
      - name: Capacitor — sync android
        if: steps.workspace-check.outputs.android_exists == 'true'
        run: |
          cd app
          npx cap sync android

      # ── Build APK ───────────────────────────────────────────────────
      - name: Build debug APK
        if: steps.workspace-check.outputs.android_exists == 'true'
        run: |
          chmod +x app/android/gradlew
          cd app/android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        if: steps.workspace-check.outputs.android_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: textfx-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
