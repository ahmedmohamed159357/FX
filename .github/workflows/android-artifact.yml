name: Android APK Build

on:
  push:
    branches: [ feat/prod-nuclear-setup ]
  workflow_dispatch:

# Only runs when CI_ANDROID secret is set to "true"
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ secrets.CI_ANDROID == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Build frontend ──────────────────────────────────────────────
      - name: Frontend — npm ci
        run: npm ci
        working-directory: app

      - name: Frontend — build
        run: npm run build
        working-directory: app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ── Capacitor sync ──────────────────────────────────────────────
      - name: Capacitor — init & add android
        run: |
          cd app
          # Init only if capacitor.config.ts exists (already present)
          npx cap add android || true   # skip if already added
          npx cap sync android

      # ── Gradle cache ────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle*') }}
          restore-keys: gradle-

      # ── Build APK ───────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: app/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: textfx-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
